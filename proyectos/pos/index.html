<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <a href="../../index.html" class="btn btn-outline-dark btn-sm mb-3">&larr; Volver al portafolio</a>
    <h1 class="h3 mb-4">Sistema de Punto de Venta (POS)</h1>

    <div class="row g-4">

      <!-- Lista de productos -->
      <div class="col-12 col-md-6">
        <h2 class="h5">Productos</h2>
        <div id="productos" class="list-group"></div>
      </div>

      <!-- Carrito -->
      <div class="col-12 col-md-6">
        <h2 class="h5">Carrito</h2>
        <table class="table table-sm bg-white">
          <thead>
            <tr><th>Producto</th><th>Cant.</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody id="carrito"></tbody>
        </table>
        <h3 class="h4">Total: $<span id="total">0.00</span></h3>
        <button id="btnCobrar" class="btn btn-success">Cobrar</button>
        <button id="btnVaciar" class="btn btn-outline-danger">Vaciar</button>
        <p id="mensaje" class="mt-3 text-success fw-semibold"></p>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
