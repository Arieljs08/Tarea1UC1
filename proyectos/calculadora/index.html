<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4" style="max-width: 360px;">
    <a href="../../index.html" class="btn btn-outline-dark btn-sm mb-3">&larr; Volver al portafolio</a>
    <h1 class="h3 mb-3">Calculadora</h1>

    <!-- Pantalla -->
    <input type="text" id="pantalla" class="form-control form-control-lg text-end mb-3" value="0" readonly>

    <!-- Botones: cada fila tiene 4 columnas -->
    <div class="row g-2">
      <div class="col-3"><button class="btn btn-secondary w-100" onclick="limpiar()">C</button></div>
      <div class="col-3"><button class="btn btn-secondary w-100" onclick="borrar()">&larr;</button></div>
      <div class="col-3"><button class="btn btn-secondary w-100" onclick="operador('%')">%</button></div>
      <div class="col-3"><button class="btn btn-warning w-100" onclick="operador('/')">&divide;</button></div>

      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('7')">7</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('8')">8</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('9')">9</button></div>
      <div class="col-3"><button class="btn btn-warning w-100" onclick="operador('*')">&times;</button></div>

      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('4')">4</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('5')">5</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('6')">6</button></div>
      <div class="col-3"><button class="btn btn-warning w-100" onclick="operador('-')">&minus;</button></div>

      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('1')">1</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('2')">2</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('3')">3</button></div>
      <div class="col-3"><button class="btn btn-warning w-100" onclick="operador('+')">+</button></div>

      <div class="col-6"><button class="btn btn-light border w-100" onclick="numero('0')">0</button></div>
      <div class="col-3"><button class="btn btn-light border w-100" onclick="numero('.')">.</button></div>
      <div class="col-3"><button class="btn btn-success w-100" onclick="calcular()">=</button></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
