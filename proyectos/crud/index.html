<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <a href="../../index.html" class="btn btn-outline-dark btn-sm mb-3">&larr; Volver al portafolio</a>
    <h1 class="h3 mb-4">CRUD de Usuarios</h1>

    <div class="row g-4">

      <!-- Formulario -->
      <div class="col-12 col-md-4">
        <form id="formulario" class="card card-body">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control mb-3">

          <label for="correo" class="form-label">Correo</label>
          <input type="email" id="correo" class="form-control mb-3">

          <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
          <button type="button" id="btnCancelar" class="btn btn-outline-secondary mt-2 d-none">Cancelar edición</button>
          <p id="mensaje" class="text-danger mt-2 mb-0"></p>
        </form>
      </div>

      <!-- Tabla -->
      <div class="col-12 col-md-8">
        <table class="table table-striped bg-white">
          <thead>
            <tr><th>Nombre</th><th>Correo</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
